name: Build and Publish to PyPI

# Runs when a release is published. A draft release does not trigger it.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    uses: ./.github/workflows/tests.yml

  build-n-publish:
    name: Build and publish Python distribution to PyPI
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      # Stops a release tagged v4.13.0 from publishing a build that says 4.12.3
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag '$TAG' does not match the version '$version' in pyproject.toml"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build a binary wheel and a source tarball
        run: uv build

      - name: Publish distribution 📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
