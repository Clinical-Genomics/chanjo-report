name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests in containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      # Runs the same containerised suite as `make test` locally: MariaDB
      # plus the test image, which installs only the locked dependencies
      - name: Run tests
        run: make test
